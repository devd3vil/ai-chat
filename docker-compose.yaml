version: '3.9'

services:
  # FastAPI application
  app:
    build: .
    container_name: ai-app
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPEN_ROUTER_API_KEY=${OPEN_ROUTER_API_KEY:-}
    depends_on:
      - ollama
    networks:
      - ai-network
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    restart: unless-stopped
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Ollama service (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ai-network
    restart: unless-stopped
    # Optionally pull model on startup (requires significant disk space)
    # command: ollama pull llama3.1

  # Optional: Database services (keep for future use)
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    networks:
      - ai-network
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7
    ports: ["6379:6379"]
    networks:
      - ai-network
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: app
    ports: ["5432:5432"]
    networks:
      - ai-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  ai-network:
    driver: bridge

volumes:
  ollama-data:
  qdrant-data:
  redis-data:
  postgres-data:
