<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Local LLaMA Q&A</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>AI Chat</h1>
            <p class="subtitle">Powered by Local LLaMA</p>
        </div>

        <div class="chat-messages" id="messages">
            <!-- Messages will appear here -->
        </div>

        <div class="chat-input-area">
            <form id="questionForm" onsubmit="sendMessage(event)">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="questionInput" 
                        placeholder="Ask me anything..." 
                        required
                        autocomplete="off"
                    >
                    <button type="submit" id="sendButton" class="send-button">
                        <span>Send</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </form>
            <div class="mode-selector">
                <label>
                    <input type="radio" name="mode" value="stream" checked>
                    Stream (Real-time)
                </label>
                <label>
                    <input type="radio" name="mode" value="full">
                    Full (Wait for complete)
                </label>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
